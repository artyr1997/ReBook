[package]
name = "rebook"
version = "0.1.0"
description = "ReBook — just books. A quiet reader for PDF, EPUB and comics in the ReNote style."
authors = ["Artur Savytskyi"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rebook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
zip = "9.1.2"
unrar = "0.5.8"
imagesize = "0.15.0"
trash = "5.2.9"
base64 = "0.23.1"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
